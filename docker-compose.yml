services:
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_pass
      POSTGRES_DB: airflow_metadata
    networks:
      - data_pipeline_net
  dwh-db:
    image: postgres:15
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: dwh_pass
      POSTGRES_DB: currency_dwh
    networks:
      - data_pipeline_net
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - data_pipeline_net
  airflow-webserver:
    image: docker.m.daocloud.io/apache/airflow:2.7.3-python3.10
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db:5432/airflow_metadata
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - data_pipeline_net
  airflow-scheduler:
    image: docker.m.daocloud.io/apache/airflow:2.7.3-python3.10
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db:5432/airflow_metadata
    command: scheduler
    networks:
      - data_pipeline_net
networks:
  data_pipeline_net:
    driver: bridge
