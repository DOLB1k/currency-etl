services:
  airflow-db:
    image: dockerhub.timeweb.cloud/library/postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_pass
      POSTGRES_DB: airflow_metadata
    ports:
      - "5433:5432"
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - data_pipeline_net

  dwh-db:
    image: dockerhub.timeweb.cloud/library/postgres:15
    environment:
      POSTGRES_USER: dwh_user
      POSTGRES_PASSWORD: dwh_pass
      POSTGRES_DB: currency_dwh
    ports:
      - "5432:5432"
    volumes:
      - dwh_data:/var/lib/postgresql/data
    networks:
      - data_pipeline_net

  minio:
    image: dockerhub.timeweb.cloud/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - data_pipeline_net

  airflow-webserver:
    image: dockerhub.timeweb.cloud/apache/airflow:2.7.3-python3.10
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db/airflow_metadata
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      MINIO_ENDPOINT: 'minio:9000'
      MINIO_ACCESS_KEY: 'minio_admin'
      MINIO_SECRET_KEY: 'minio_pass'
      DWH_CONNECTION_STRING: 'postgresql+psycopg2://dwh_user:dwh_pass@dwh-db:5432/currency_dwh'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - data_pipeline_net

  airflow-scheduler:
    image: dockerhub.timeweb.cloud/apache/airflow:2.7.3-python3.10
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_pass@airflow-db/airflow_metadata
      MINIO_ENDPOINT: 'minio:9000'
      MINIO_ACCESS_KEY: 'minio_admin'
      MINIO_SECRET_KEY: 'minio_pass'
      DWH_CONNECTION_STRING: 'postgresql+psycopg2://dwh_user:dwh_pass@dwh-db:5432/currency_dwh'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: scheduler
    networks:
      - data_pipeline_net

volumes:
  airflow_db_data:
  dwh_data:
  minio_data:

networks:
  data_pipeline_net:
    driver: bridge
